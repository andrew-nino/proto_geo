syntax = "proto3";

package gateway;

option go_package = "gen/gateway/go;pb_v1";

// Iam service provides authentication and authorization operations
service Iam {
  // Register creates a new user account
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // Login authenticates a user and returns a token
  rpc Login(LoginRequest) returns (LoginResponse);
  // Verify checks if a token is valid
  rpc Verify(VerifyRequest) returns (VerifyResponse);
  // GetPublicKey returns the public key for token verification
  rpc GetPublicKey(PublicKeyRequest) returns (PublicKeyResponse);
  // Logout invalidates a user's token
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // RefreshToken generates a new token for an authenticated user
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
}

message RegisterRequest {
  string username = 1;
  string password = 2;
  string email    = 3;
}

message RegisterResponse {
  bool success = 1;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
}

message VerifyRequest {
  string token = 1;
}

message VerifyResponse {
  bool valid = 1;
}

message PublicKeyRequest {}

message PublicKeyResponse {
  bytes public_key = 1;
}

message LogoutRequest {
  string token = 1;
}

message LogoutResponse {
  bool success = 1;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
}